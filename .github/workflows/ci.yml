name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Policy, planner and scenario tests (no network)
        run: node --test agent/
      - name: Contract unit tests
        working-directory: contract
        run: cargo test
      - name: Contract wasm build
        working-directory: contract
        run: rustup target add wasm32-unknown-unknown && ./build.sh
      - name: Factory unit tests (embeds the vault wasm built above)
        working-directory: factory
        run: cargo test
